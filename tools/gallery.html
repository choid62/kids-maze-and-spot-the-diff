<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 점검</title>
<style>
  body { margin: 0; background: #fff; font: 11px sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- 점검용 페이지: 각 그림의 눈/무늬/부분 변형을 한 줄씩 보여 준다.
     ?mode=face  : 원래 | 웃는 눈 | 점박이 | 하트 | 별 | 전체 색
     ?mode=parts : 원래 | 부분마다 (숨김, 키움, 돌림, 색)
     &from=0&count=40 : 보여 줄 범위 -->
<canvas id="c"></canvas>
<script src="../js/emoji-data.js"></script>
<script src="../js/emoji-render.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || 'face';
  const names = (q.get('names') ? q.get('names').split(',') : Object.keys(EMOJI).sort()).slice(Number(q.get('from') || 0), Number(q.get('from') || 0) + Number(q.get('count') || 40));
  const cell = 64, label = 120;
  const rows = names.map((n) => {
    const e = EMOJI[n];
    if (mode === 'face') {
      return [n, [{}, e.eyes ? { eyes: 'smile' } : null,
        { pattern: { type: 'dots', color: e.baseLum < 0.55 ? '#fff' : '#FF4F8B' } },
        { pattern: { type: 'hearts', color: e.baseLum < 0.55 ? '#fff' : '#FF4F8B' } },
        { pattern: { type: 'stars', color: e.baseLum < 0.55 ? '#fff' : '#4F7BFF' } },
        { hue: 150 }]];
    }
    const v = [{}];
    // 생성기(js/scene.js)와 같은 조건으로 허용된 변형만 보여 준다
    e.parts.forEach((p, i) => v.push(
      p.share <= 0.12 && p.seen >= 0.012 ? { parts: { [i]: { hide: true } } } : null,
      p.share >= 0.03 && p.share <= 0.15 ? { parts: { [i]: { scale: 1.55 } } } : null,
      p.edge && p.share >= 0.03 && p.share <= 0.2 ? { parts: { [i]: { rot: 38 } } } : null,
      p.sat >= 0.25 && p.share <= 0.3 && p.seen >= 0.015 ? { parts: { [i]: { hue: 150 } } } : null));
    return [n, v];
  });
  const cols = Math.max(...rows.map((r) => r[1].length));
  const c = document.getElementById('c');
  c.width = label + cols * cell;
  c.height = rows.length * cell;
  const ctx = c.getContext('2d');
  rows.forEach(([n, vs], r) => {
    ctx.fillStyle = r % 2 ? '#f4f4f4' : '#fff';
    ctx.fillRect(0, r * cell, c.width, cell);
    ctx.fillStyle = '#333';
    ctx.fillText(n, 4, r * cell + cell / 2 + 4);
    vs.forEach((m, i) => {
      if (!m) return;
      if (mode === 'parts' && i > 0 && (i - 1) % 4 === 0) {
        ctx.fillStyle = '#ddd';
        ctx.fillRect(label + i * cell - 1, r * cell, 2, cell);
      }
      EmojiRender.draw(ctx, n, label + i * cell + cell / 2, r * cell + cell / 2, cell * 0.8, false, m);
    });
  });
</script>
</body>
</html>
