<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFB74D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="미로놀이">
  <title>미로랑 틀린그림</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="screen-home" class="screen">
      <button class="corner-btn" id="btn-settings" aria-label="부모 설정">⚙️</button>
      <h1 class="title">뭐 하고 놀까?</h1>
      <div class="home-buttons">
        <button class="big-btn maze" data-go="maze"><canvas class="btn-art" data-art="maze"></canvas><span class="btn-label">미로<small id="home-maze-level"></small></span></button>
        <button class="big-btn spot" data-go="spot"><canvas class="btn-art" data-art="spot"></canvas><span class="btn-label">틀린그림<small id="home-spot-level"></small></span></button>
      </div>
      <button class="sticker-btn" data-go="stickers">⭐ <span id="star-count">0</span></button>
    </section>

    <section id="screen-maze" class="screen">
      <header class="bar">
        <button class="round-btn" data-go="home" aria-label="처음으로">🏠</button>
        <div class="bar-mid"><button class="level-pill" id="maze-level" data-pick="maze" aria-label="레벨 고르기"></button></div>
        <button class="round-btn" id="maze-new" aria-label="새 미로">🔄</button>
      </header>
      <div class="stage"><canvas id="maze-canvas"></canvas></div>
    </section>

    <section id="screen-spot" class="screen">
      <header class="bar">
        <button class="round-btn" data-go="home" aria-label="처음으로">🏠</button>
        <div class="bar-mid col"><button class="level-pill" id="spot-level" data-pick="spot" aria-label="레벨 고르기"></button><div class="dots" id="spot-dots"></div></div>
        <button class="round-btn" id="spot-hint" aria-label="힌트">💡</button>
      </header>
      <div class="stage"><canvas id="spot-canvas"></canvas></div>
    </section>

    <section id="screen-stickers" class="screen">
      <header class="bar">
        <button class="round-btn" data-go="home" aria-label="처음으로">🏠</button>
        <div class="bar-mid">⭐ <span id="sticker-total">0</span></div>
        <span class="spacer"></span>
      </header>
      <p id="sticker-empty" class="empty hidden">아직 스티커가 없어요.<br>놀이를 끝내면 스티커를 받아요!</p>
      <div id="sticker-grid" class="sticker-grid"></div>
    </section>
  </main>

  <div id="celebrate" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="card">
      <canvas id="sticker-prize"></canvas>
      <div class="cheer" id="cheer-text">잘했어!</div>
      <div class="levelup hidden" id="levelup"></div>
      <div class="row">
        <button class="round-btn big" id="cele-home" aria-label="처음으로">🏠</button>
        <button class="round-btn big primary" id="cele-next" aria-label="다음">▶</button>
      </div>
    </div>
  </div>

  <div id="levels" class="overlay hidden">
    <div class="card">
      <p class="card-title" id="levels-title">레벨 고르기</p>
      <div class="level-grid" id="level-grid"></div>
      <div class="level-legend" id="level-legend"></div>
      <button class="text-btn" id="levels-close">닫기</button>
    </div>
  </div>

  <div id="gate" class="overlay hidden">
    <div class="card">
      <p class="card-title">어른만 열 수 있어요</p>
      <p class="gate-q" id="gate-q"></p>
      <div class="choices" id="gate-choices"></div>
      <button class="text-btn" id="gate-cancel">닫기</button>
    </div>
  </div>

  <div id="settings" class="overlay hidden">
    <div class="card settings">
      <p class="card-title">부모 설정</p>
      <div class="set-row"><span>효과음</span><button id="set-sound" class="pill"></button></div>
      <div class="set-row"><span>칭찬 목소리</span><button id="set-voice" class="pill"></button></div>
      <div class="set-row"><span>미로 레벨 (1~10)</span>
        <span class="stepper"><button data-key="mazeLevel" data-step="-1">−</button><b id="set-mazeLevel"></b><button data-key="mazeLevel" data-step="1">+</button></span></div>
      <div class="set-row"><span>틀린그림 레벨 (1~15)</span>
        <span class="stepper"><button data-key="spotLevel" data-step="-1">−</button><b id="set-spotLevel"></b><button data-key="spotLevel" data-step="1">+</button></span></div>
      <div class="set-row"><span>모은 스티커</span><b id="set-count"></b></div>
      <p class="hint-text">1~3 쉬움, 4~6 보통, 7~8 어려움, 9~10 아주 어려움, 11~15 최고(틀린그림만). 게임 화면 위쪽 레벨 표시를 눌러도 레벨을 고를 수 있어요. 미로는 끝낼 때마다, 틀린그림은 힌트 없이 끝냈을 때 한 레벨씩 올라가요.</p>
      <div class="row">
        <button class="text-btn danger" id="set-reset">처음부터 다시</button>
        <button class="text-btn primary" id="set-close">닫기</button>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/emoji-data.js"></script>
  <script src="js/bg-data.js"></script>
  <script src="js/bg-images.js"></script>
  <script src="js/emoji-render.js"></script>
  <script src="js/maze.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui-maze.js"></script>
  <script src="js/ui-spot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
